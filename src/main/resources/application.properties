spring.application.name=logout

#Tomcat configuration
server.port=5323

#Log level configuration

logging.level.root=INFO
logging.level.com.logout=INFO
org.springframework.security.level=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN


#Database Postgresql configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/logout
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=validate
server.servlet.context-path=/api

#JWT
app.secret-key=${JWT_SECRET}
app.expiration-time=900000

# Active l'exécution automatique de schema.sql et data.sql
spring.sql.init.mode=always

# Diffère l'initialisation de la datasource si besoin
spring.jpa.defer-datasource-initialization=true

pring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:file:.env[.properties]


# spring.profiles.active=dev
